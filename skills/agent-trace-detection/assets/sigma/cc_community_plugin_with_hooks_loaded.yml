title: Community or local plugin with hooks loaded
id: 3dd6fdf7-cdab-4c85-b8db-ac7330e36615
status: experimental
description: A plugin from a community or user-local scope that registers hooks was loaded at session start. Hooks run shell
  commands on agent events with the user's privileges.
references:
- https://code.claude.com/docs/en/monitoring-usage
- https://github.com/howardhsieh/agent-security-skills
author: Howard Hsieh
date: '2026-09-29'
tags:
- atlas.aml-t0010.005
- owasp.asi04
logsource:
  product: claude_code
  service: otel
detection:
  selection:
    event.name: plugin_loaded
    has_hooks: 'true'
    plugin.scope:
    - community
    - user-local
  condition: selection
falsepositives:
- Reviewed and pinned plugins; tune with an allowlist of plugin_id_hash values
level: low
