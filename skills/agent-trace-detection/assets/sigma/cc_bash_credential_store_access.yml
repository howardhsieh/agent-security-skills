title: Claude Code shell command touched a credential store
id: 3bea4cc6-9ddb-4764-8e1d-ff873234492c
status: experimental
description: A Bash tool call referenced a local credential store (cloud CLI credentials, SSH private keys, GitHub CLI tokens,
  git or package-manager credentials, macOS keychain). Needs OTEL_LOG_TOOL_DETAILS=1.
references:
- https://code.claude.com/docs/en/monitoring-usage
- https://github.com/howardhsieh/agent-security-skills
author: Howard Hsieh
date: '2026-09-29'
tags:
- attack.t1552.001
- atlas.aml-t0098
- owasp.asi03
logsource:
  product: claude_code
  service: otel
detection:
  selection:
    event.name:
    - tool_decision
    - tool_result
    tool_name: Bash
    tool_parameters.bash_command|contains:
    - .aws/credentials
    - .ssh/id_
    - .config/gh/hosts.yml
    - .git-credentials
    - .netrc
    - .npmrc
    - .pypirc
    - .docker/config.json
    - .kube/config
    - security find-generic-password
    - security find-internet-password
  condition: selection
falsepositives:
- Explicit user requests to debug their own CLI authentication
level: medium
