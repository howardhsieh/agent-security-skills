id: CC-EXF-001
title: Secret read followed by an outbound network call (Claude Code)
status: experimental
severity: critical
category: exfiltration
description: >
  The agent read a secret-looking file (.env, SSH key, cloud or package-manager
  credentials) and later in the same session made an outbound call: a network
  shell command, a web fetch, or an MCP tool that sends or writes data. The
  core agent exfiltration chain. Needs traces from normalize.py.
tags:
  - owasp-asi02
  - atlas-aml-t0086
  - llm02-2025
references:
  - https://github.com/howardhsieh/agent-security-skills
detection:
  taint:
    source_label: secret
    sink|matches: "^((Bash|PowerShell)\\(network\\)|WebFetch|mcp__.*(send|post|create|upload|write|message|comment|email).*)$"
