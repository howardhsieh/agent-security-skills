id: CC-INJ-004
title: Untrusted tool result asks for credentials (Claude Code)
status: experimental
severity: high
category: injection
description: >
  A web or MCP tool result contains text asking the agent or user to paste,
  send or reveal a token, password or key. Credential solicitation in tool
  output is a strong indirect prompt-injection signal.
tags:
  - owasp-asi01
  - atlas-aml-t0051-001
references:
  - https://github.com/howardhsieh/agent-security-skills
detection:
  selection:
    labels: untrusted
    result_preview|matches: "((paste|send|share|provide|post|include|reveal)[^.]{0,40}(api[ _-]?key|access token|token|password|secret|credentials|ssh key))|((api[ _-]?key|token|password|secret|credentials)[^.]{0,40}(paste|send|share|provide|post|reveal))"
