id: CC-EXF-002
title: Secret read followed by a publish or push (Claude Code)
status: experimental
severity: critical
category: exfiltration
description: >
  The agent read a secret-looking file and later pushed code, published a
  package or created a release or gist in the same session. Secrets committed
  or published this way leave the machine permanently.
tags:
  - owasp-asi02
  - atlas-aml-t0086
references:
  - https://github.com/howardhsieh/agent-security-skills
detection:
  taint:
    source_label: secret
    sink|matches: "^(Bash|PowerShell)\\(publish\\)$"
